{% extends "base.html" %}

{% block conteudo %}
    <h2 style="color: #3FB8AF;">Meus Projetos:</h2>
    <ul>
        {% for item in projetos %}
            <li class="cartao">
                <strong>{{ item.nome }}</strong>
                <p>{{ item.descricao }}</p>
                <p>{{ item.data_criacao }}</p>
                <p> {{ item.linguagem }}</p>
                <p>{{ item.categoria }}</p>
            </li>
        {% endfor %}
{% endblock %}
