{% extends "base.html" %}

{% block conteudo %}
    <h1>Meus Projetos</h1>

    <ul>
        {% for p in projetos %}
            <li>
                <a href="/projetos/{{ p.id }}/">{{ p.nome }}</a>
            </li>
        {% empty %}
            <p>Nenhum projeto cadastrado ainda.</p>
        {% endfor %}
    </ul>

    <br>
    <a href="/projetos/novo/">+ Novo projeto</a>
{% endblock %}
