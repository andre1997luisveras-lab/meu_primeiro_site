{% extends "base.html" %}

{% block conteudo %}
    <h1 class="botao">{{projeto.nome}}</h1>
    <p>{{projeto.descricao}}</p>
    <p>Ano: {{projeto.ano}}</p>
    <p>Categoria: {{ projeto.categoria }}</p>
        {% if projeto.concluido %}
            <p>Concluído ✔ </p>
        {% else %}
            <p>Em andamento</p>
        {% endif %}

    
    <a href="/projetos/{{ projeto.id }}/editar/" class="botao-azul">Editar</a>
    <a href="/projetos/{{ projeto.id }}/excluir/" class="botao-vermelho">Excluir</a>
    <a href="/projetos/" class="botao-cinza">Voltar</a>
{% endblock %}
