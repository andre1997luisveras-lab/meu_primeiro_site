{% extends "base.html" %}

{% block conteudo %}
    <h1>{{projeto.nome}}</h1>
    <p>{{projeto.descricao}}</p>
    <p>Ano: {{projeto.ano}}</p>
    <p>Categoria: {{ projeto.categoria }}</p>
        {% if projeto.concluido %}
            <p>Concluído ✔ </p>
        {% else %}
            <p>Em andamento</p>
        {% endif %}

    <div class="botao-azul "><a href="/projetos/{{ projeto.id }}/editar/">Editar</a></div>
    <div class="botao-vermelho "><a href="/projetos/{{ projeto.id }}/excluir/">Excluir</a></div>
    <div class="botao-cinza "><a href="/projetos/">Voltar</a></div>
{% endblock %}
